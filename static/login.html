<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
/* ── CDN-independent fallback: page stays pixel-perfect even if Tailwind/fonts CDN are blocked (Iran filtering) ── */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#0f0f12;color:#fff;min-height:100vh}
.h-screen{height:100vh}.w-screen{width:100vw}.relative{position:relative}.absolute{position:absolute}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-center{justify-content:center}
.overflow-hidden{overflow:hidden}.text-center{text-align:center}.mx-4{margin-left:1rem;margin-right:1rem}
.gap-2{gap:.5rem}.gap-4{gap:1rem}.gap-6{gap:1.5rem}
.p-8{padding:2rem}.py-3{padding-top:.75rem;padding-bottom:.75rem}.py-3\.5{padding-top:.875rem;padding-bottom:.875rem}
.pr-4{padding-right:1rem}.pl-12{padding-left:3rem}.mt-2{margin-top:.5rem}
.text-xs{font-size:.75rem;line-height:1rem}.text-sm{font-size:.875rem;line-height:1.25rem}.text-2xl{font-size:1.5rem;line-height:2rem}
.font-medium{font-weight:500}.font-bold{font-weight:700}.tracking-wider{letter-spacing:.08em}
.text-white{color:#fff}.text-on-surface-variant{color:#9aa0a6}
.rounded-2xl{border-radius:1rem}.rounded-3xl{border-radius:1.5rem}
.shadow-2xl{box-shadow:0 25px 50px -12px rgba(0,0,0,.7)}
.max-w-md{max-width:28rem}.w-full{width:100%}
.top-1-2{top:50%;transform:translateY(-50%)}
.left-4{left:1rem}.z-10{z-index:10}
.hidden{display:none!important}
input.input-glass{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:.9rem;color:#fff;font-size:.95rem;outline:none;transition:border .2s, box-shadow .2s}
input.input-glass::placeholder{color:#6b7280}
input.input-glass:focus{border-color:rgba(255,255,255,.4);box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.glass-card{background:rgba(26,26,31,.88);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
button.btn-submit{width:100%;background:#fff;color:#000;border:0;border-radius:.9rem;font-weight:700;font-size:.95rem;cursor:pointer;transition:opacity .2s}
button.btn-submit:hover{opacity:.88}
button.btn-submit:disabled{opacity:.55;cursor:wait}
@keyframes fallback-spin{to{transform:rotate(360deg)}}
.animate-spin{animation:fallback-spin 1s linear infinite}
@keyframes fallback-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.error-msg{color:#ff6b6b}
.hero-container{position:relative;display:flex;align-items:center;justify-content:center;min-height:100vh}
.hero-vertical-text{position:absolute;left:22%;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:1.1rem;font-weight:900;font-size:1.15rem;letter-spacing:.1em;color:#e5e5e5;user-select:none}
.hero-halo{position:absolute;left:12%;top:50%;transform:translate(-50%,-50%);width:500px;height:500px;border:1px solid rgba(255,255,255,.09);border-radius:50%;pointer-events:none}
.hero-statue{position:absolute;left:-2%;top:50%;transform:translateY(-42%);height:96vh;max-width:44vw;object-fit:contain;opacity:.9;filter:grayscale(1) contrast(1.05);pointer-events:none}
.badge-item{padding:.35rem .8rem;font-size:.72rem;letter-spacing:.12em;border:1px solid rgba(255,255,255,.25);border-radius:.45rem;color:#d4d4d8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
@media(max-width:900px){.hero-vertical-text,.hero-halo,.hero-statue{display:none}}
/* Material Symbols fallback: hide ligature text if font not loaded */
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;display:inline-block;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-size:18px;overflow:hidden;max-width:1.2em;max-height:1.2em;vertical-align:middle}
html:not(.ms-ok) .material-symbols-outlined{font-size:0!important;max-width:none}
.badge-item{white-space:nowrap}
img.hero-statue[alt]:not([data-ok]){color:transparent;font-size:0}
</style>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700;900&display=swap" rel="stylesheet"/>

<script>
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                "on-surface": "#e2e2e2",
                "on-surface-variant": "#94a3b8",
                "background": "#0f0f12"
            },
            fontFamily: {
                "headline-lg": ["Inter"],
                "body-sm": ["Inter"],
                "body-lg": ["Inter"],
                "code-label": ["JetBrains Mono"]
            }
        }
    }
}
</script>

<style>
/* Prevent zoom on all devices */
html, body {
    touch-action: pan-y;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
* {
    touch-action: pan-y;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
/* استایل کلی و پس‌زمینه */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none !important;
    -webkit-user-select: none !important;
}

input, textarea, select {
    user-select: text;
    -webkit-user-select: text;
}

body {
    background-color: #0f0f12 !important;
    color: #e2e2e2 !important;
    min-height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: relative;
    font-family: 'Inter', sans-serif;
}

/* کانتینر مجسمه در سمت چپ */
.hero-container {
    position: absolute;
    left: 0;
    bottom: 0;
    top: 0;
    width: 60vw;
    max-width: 900px;
    display: flex;
    justify-content: flex-start;
    align-items: flex-end;
    pointer-events: none;
    z-index: 1; /* در لایه زیرین باکس لاگین قرار می‌گیرد */
}

/* تصویر مجسمه */
.hero-statue {
    height: 98vh;
    max-height: 100%;
    width: auto;
    object-fit: contain;
    object-position: bottom left;
    opacity: 0.92;
    image-rendering: pixelated;
    -webkit-mask-image: linear-gradient(90deg, #000 65%, transparent 100%);
    mask-image: linear-gradient(90deg, #000 65%, transparent 100%);
}

/* هاله دایره‌ای دور سر مجسمه */
.hero-halo {
    position: absolute;
    left: 14%;
    top: 6%;
    width: clamp(280px, 34vw, 550px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.14);
    z-index: 0;
    animation: breathe 7s ease-in-out infinite;
}

@keyframes breathe {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.85; transform: scale(1.02); }
}



/* کادر مینیمال گوشه بالا راست */
.badge-bar {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    gap: 12px;
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    color: rgba(255, 255, 255, 0.5);
    z-index: 20;
    letter-spacing: 0.1em;
}

.badge-item {
    border: 1px solid rgba(255, 255, 255, 0.18);
    padding: 4px 10px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
}

/* کارت شیشه‌ای لاگین */
.glass-card {
    background: rgba(10, 10, 15, 0.65) !important;
    backdrop-filter: blur(24px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
    border: 1px solid rgba(255, 255, 255, 0.12) !important;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8) !important;
}

/* ورودی فرم */
.input-glass {
    background-color: rgba(0, 0, 0, 0.5) !important;
    border: 1px solid rgba(255, 255, 255, 0.15) !important;
    color: #e2e2e2 !important;
    caret-color: #e2e2e2 !important;
    transition: all 0.3s ease;
}

.input-glass:focus {
    border-color: rgba(255, 255, 255, 0.6) !important;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.15) !important;
    outline: none;
}

/* دکمه ورود */
.btn-submit {
    background-color: #ffffff !important;
    color: #000000 !important;
    transition: all 0.25s ease;
}

.btn-submit:hover {
    background-color: #e2e2e2 !important;
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
}

.btn-submit:active {
    transform: translateY(0);
}

/* پیغام خطا */
.error-msg {
    background: rgba(255, 180, 171, 0.1);
    border: 1px solid rgba(255, 180, 171, 0.3);
    color: #ffb4ab;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    display: none;
    align-items: center;
    gap: 8px;
}
.error-msg.show { display: flex; }

/* رفتار اختصاصی نسخه موبایل */
@media (max-width: 768px) {
    .hero-container {
        width: 100vw;
        max-width: none;
        opacity: 0.45; /* مات‌تر برای خوانایی بهتر فرم روی موبایل */
        justify-content: center;
    }
    .hero-statue {
        object-position: center bottom;
        height: 85vh;
        -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent 100%);
        mask-image: linear-gradient(180deg, #000 70%, transparent 100%);
    }
    .hero-halo {
        left: 50%;
        transform: translateX(-50%);
        top: 10%;
        width: 320px;
    }
    .hero-vertical-text {
        left: 15%;
        opacity: 0.35;
    }
    .badge-bar {
        top: 16px;
        right: 16px;
        font-size: 0.65rem;
    }
}
</style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center relative">

<!-- نوار شناور بالا (بدون کلید release) -->
<div class="badge-bar">
    <span class="badge-item">★ 2026</span>
    </div>

<!-- بک‌گراند: مجسمه دایترد و هاله (در سمت چپ) -->
<div class="hero-container">
    <div class="hero-halo"></div>
        </div>

<!-- باکس ورود (روی مجسمه و لایه z-10) -->
<div class="glass-card rounded-3xl w-full max-w-md p-8 mx-4 flex flex-col gap-6 shadow-2xl z-10 relative">
    <!-- Header -->
    <div class="flex flex-col items-center gap-2 text-center">
        <img src="/static/spider-logo.svg" alt="Panel" onerror="this.style.display='none'" style="width:96px;height:96px;margin-bottom:2px">
        <h1 class="text-2xl font-bold tracking-wider text-white">PANEL</h1>
        <p class="text-xs text-on-surface-variant font-medium">High Performance Panel</p>
    </div>

    <!-- Error -->
    <div class="error-msg" id="error-msg">
        <span class="material-symbols-outlined" style="font-size:18px;">error</span>
        <span id="error-text"></span>
    </div>

    <!-- Form -->
    <form class="flex flex-col gap-4" id="login-form">
        <div class="flex flex-col gap-2">
            <label class="font-code-label text-xs text-on-surface-variant tracking-wider" for="password">PASSWORD</label>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-size: 20px;">lock</span>
                <input class="input-glass w-full rounded-2xl py-3 pl-12 pr-4 text-sm text-white placeholder:text-gray-500 font-sans" id="password" placeholder="Enter password" type="password" autofocus required/>
            </div>
        </div>
        
        <button class="mt-2 btn-submit font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 text-sm" id="loginBtn" type="submit">
            <span id="btn-text" class="flex items-center gap-2">Sign In <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span></span>
            <span id="btn-spinner" class="hidden"><span class="material-symbols-outlined animate-spin" style="font-size: 18px;">progress_activity</span></span>
        </button>
    </form>
</div>

<!-- لاجیک احراز هویت -->
<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('loginBtn');
    var btnText = document.getElementById('btn-text');
    var btnSpinner = document.getElementById('btn-spinner');
    var errDiv = document.getElementById('error-msg');
    var errText = document.getElementById('error-text');

    errDiv.classList.remove('show');
    btn.disabled = true;
    btnText.classList.add('hidden');
    btnSpinner.classList.remove('hidden');

    try {
        var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 12000) : null;
        var r;
        try {
            r = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: document.getElementById('password').value }),
                signal: ctrl ? ctrl.signal : undefined
            });
        } catch (fetchEx) {
            if (timer) clearTimeout(timer);
            throw new Error(fetchEx && fetchEx.name === 'AbortError'
                ? 'پاسخی از سرور دریافت نشد (تایم‌اوت)'
                : 'ارتباط با سرور برقرار نشد');
        }
        if (timer) clearTimeout(timer);
        if (!r.ok) {
            var d = await r.json().catch(function() { return {}; });
            throw new Error(d.detail || 'Login failed');
        }
        location.href = window.ADMIN_BASE || '/spider';
    } catch(ex) {
        errText.textContent = ex.message;
        errDiv.classList.add('show');
        btn.disabled = false;
        btnText.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
    }
});
</script>

<!-- جلوگیری از زوم یا کپی ناخواسته -->
<script>
document.addEventListener('wheel', function(e) { if(e.ctrlKey || e.metaKey) e.preventDefault(); }, {passive:false});
document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].indexOf(e.key) >= 0) e.preventDefault();
    if ((e.ctrlKey || e.metaKey) && (e.key || '').toLowerCase() === 'c' && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || '')) e.preventDefault();
});
['copy', 'cut', 'contextmenu', 'selectstart', 'dragstart'].forEach(function(x) {
    document.addEventListener(x, function(e) {
        if (!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || '')) e.preventDefault();
    });
});
['touchstart', 'touchmove'].forEach(function(x) {
    document.addEventListener(x, function(e) {
        if (e.touches.length > 1) {
            e.preventDefault();
            e.stopPropagation();
        }
    }, {passive:false});
});
document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
document.addEventListener('gestureend', function(e) { e.preventDefault(); });
</script>
<script>
(function(){
  function ok(){ document.documentElement.classList.add('ms-ok'); }
  try {
    if (document.fonts && document.fonts.load) {
      document.fonts.load('18px "Material Symbols Outlined"', 'lock').then(function(faces){
        if (faces && faces.length) ok();
      }).catch(function(){});
      // retry once in case the stylesheet arrived late
      setTimeout(function(){
        if (!document.documentElement.classList.contains('ms-ok'))
          document.fonts.load('18px "Material Symbols Outlined"', 'lock').then(function(faces){
            if (faces && faces.length) ok();
          }).catch(function(){});
      }, 1500);
    }
  } catch(e) {}
})();
</script>
</body>
</html>
